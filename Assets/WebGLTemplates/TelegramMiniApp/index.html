<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #cfeaff; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; font-family: sans-serif;
        color: #2b4b7a; background: #cfeaff; z-index: 5;
      }
      #bar { width: 60%; max-width: 360px; height: 14px; background: #ffffff88; border-radius: 8px; overflow: hidden; margin-top: 16px; }
      #barFill { width: 0%; height: 100%; background: #3b6bf0; transition: width .15s; }
      #backBtn {
        position: fixed; top: 10px; left: 10px; z-index: 10; border: 0; cursor: pointer;
        background: #ffffffcc; color: #2b4b7a; font-weight: bold; font-family: sans-serif;
        border-radius: 12px; padding: 10px 16px; font-size: 16px; display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <button id="backBtn">◀ Orqaga</button>
    <div id="loading">
      <div style="font-size:22px;font-weight:bold;">Yuklanmoqda…</div>
      <div id="bar"><div id="barFill"></div></div>
    </div>

    <script>
      // --- Telegram Mini App ---
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      function goBack() {
        // Mini App'ga qaytamiz (ilovani yopmaymiz)
        if (window.history.length > 1) window.history.back();
        else window.location.href = "../";
      }
      if (tg) {
        tg.ready();
        tg.expand();
        try { tg.setHeaderColor && tg.setHeaderColor("#cfeaff"); } catch (e) {}
        try { tg.BackButton.show(); tg.BackButton.onClick(goBack); } catch (e) {}
        try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
      } else {
        // Telegramdan tashqarida ochilsa — oddiy orqaga tugmasi
        document.getElementById("backBtn").style.display = "block";
      }
      document.getElementById("backBtn").onclick = goBack;

      // --- Unity WebGL ---
      var canvas = document.querySelector("#unity-canvas");
      var barFill = document.getElementById("barFill");
      var loading = document.getElementById("loading");

      var script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        }, function (progress) {
          barFill.style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          loading.innerHTML = "<div style='padding:20px;text-align:center'>Xatolik: " + message + "</div>";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
